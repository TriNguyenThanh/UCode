services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT_EXTERNAL}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ucode_network
  redis:
    image: redis:7-alpine
    container_name: ucode-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: ucode-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: unless-stopped
    
  postgres:
    image: postgres:15-alpine
    container_name: ucode-postgres
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ucode_network
    restart: unless-stopped
  
  api-gateway:
    build:
      context: ./backend/src/api-gateway
      dockerfile: Dockerfile.dev
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JWT__KEY=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - JWT__ISSUER=UserService
      - JWT__AUDIENCE=UserServiceClient
    volumes:
      - ./backend/src/api-gateway:/app
    depends_on:
      - user-service
      - assignment-service
    networks:
      - ucode_network
    restart: on-failure

  user-service:
    build:
      context: ./backend/src/user-service
      dockerfile: Dockerfile.dev
    container_name: user-service
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${USER_SERVICE_CONNECTION_STRING}
      - JWT__KEY=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - JWT__ISSUER=UserService
      - JWT__AUDIENCE=UserServiceClient
      - ServiceUrls__AssignmentService=http://assignment-service:5002
    volumes:
      - ./backend/src/user-service:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ucode_network
    restart: on-failure
    command: 
      bash -c "dotnet run --project Api/UserService.Api.csproj --urls http://0.0.0.0:5001"

  assignment-service:
    build:
      context: ./backend/src/assignment-service
      dockerfile: Dockerfile.dev
    container_name: assignment-service
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AssignmentDb=${ASSIGNMENT_SERVICE_CONNECTION_STRING}
      - AssignmentDb=${ASSIGNMENT_SERVICE_CONNECTION_STRING}
      - UserService__BaseUrl=${USER_SERVICE_URL}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__Port=${RABBITMQ_PORT}
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./backend/src/assignment-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ucode_network
    restart: on-failure
    command: 
      bash -c "dotnet run --project Api/Api.csproj --urls http://0.0.0.0:5002"

  judge-service:
    build:
      context: ./backend/src/judge-service
      dockerfile: Dockerfile.dev
    container_name: judge-service
    privileged: true
    cap_add:
      - SYS_ADMIN
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      - MAX_CONCURRENT_SUBMISSIONS=${MAX_CONCURRENT_SUBMISSIONS}
      - MAX_PARALLEL_TESTCASES=${MAX_PARALLEL_TESTCASES}
      - MEMORY_THRESHOLD=${MEMORY_THRESHOLD}
      - CPU_THRESHOLD=${CPU_THRESHOLD}
      - ISOLATE_NICE=12             # 10–19 = kém ưu tiên hơn
      - EVENTLOOP_CPU=0             # pin event loop vào core 0 (tùy chọn)
      - ISOLATE_CPU_AFFINITY=1-4    
    tty: true
    stdin_open: true
    volumes:
      - ./backend/src/judge-service:/app
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ucode_network
    restart: on-failure
  
  file-service:
    build:
      context: ./backend/src/file-service
      dockerfile: Dockerfile.dev
    container_name: file-service
    ports:
      - "5073:5073"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS__Region=${AWS_REGION}
      - AWS__BucketName=${AWS_S3_BUCKET_NAME}
      - AWS__AccessKey=${AWS_ACCESS_KEY_ID}
      - AWS__SecretKey=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./backend/src/file-service:/app
    networks:
      - ucode_network
    restart: on-failure
    command: dotnet watch run --project file-service.csproj --urls http://0.0.0.0:5073

  
  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx-proxy
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - api-gateway
  #   networks:
  #     - ucode_network
  #   restart: unless-stopped

volumes:
  redis-data:
  postgres-data:

networks:
  ucode_network:
    driver: bridge